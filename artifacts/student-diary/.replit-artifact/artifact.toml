kind = "mobile"
previewPath = "/student-diary/"
title = "Student Diary"
description = "A responsive student companion for viewing a profile, course attendance, notices, schedule, and academic records. Course attendance is calculated from editable class counts and includes a 60% target tracker."
version = "1.0.0"
id = "artifacts/student-diary"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/student-diary/" ]
localPort = 21026

[services.development]
run = "pnpm --filter @workspace/student-diary run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-diary", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/student-diary", "run", "serve" ]

[services.env]
PORT = "21026"
BASE_PATH = "/student-diary/"
